name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Write organisation policy (optional secret POLICY_TS)
        env:
          POLICY_TS: ${{ secrets.POLICY_TS }}
        run: |
          if [ -n "$POLICY_TS" ]; then printf '%s\n' "$POLICY_TS" > src/policy.local.ts; echo 'policy.local.ts written'; else echo '::warning::POLICY_TS secret not set: building with an EMPTY policy (no impersonation checks for your people)'; fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_RDAP_ORIGIN: ${{ vars.RDAP_ORIGIN }}
      - run: npm audit --omit=dev --audit-level=high
      - name: Build deployable package
        env:
          ADDIN_ORIGIN: ${{ vars.ADDIN_ORIGIN }}
        run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: outlook-forensics-release
          path: release/*.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
